name: AI QA Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan'
        required: true
        default: 'https://staging.example.com'
      max_pages:
        description: 'Maximum pages to crawl'
        required: false
        default: '10'
      baseline:
        description: 'Path to baseline file (e.g. results/baseline.json)'
        required: false
        default: ''

jobs:
  qa_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run AI QA Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI_FAIL_ON_NEW_CRITICAL: 'true'
          CI_FAIL_ON_NEW_HIGH: 'true'
          CI_FAIL_ON_NEW_MEDIUM: 'false'
        run: |
          # Build baseline argument
          BASELINE_ARG=""
          if [ -n "${{ github.event.inputs.baseline }}" ]; then
            BASELINE_ARG="--baseline ${{ github.event.inputs.baseline }}"
          fi

          python run_qa.py ${{ github.event.inputs.target_url }} \
            --max-pages ${{ github.event.inputs.max_pages }} \
            --ci \
            $BASELINE_ARG

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            user_data/
            results/
