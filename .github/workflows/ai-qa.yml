name: AI QA Pipeline & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan'
        required: true
        default: 'https://staging.example.com'
      max_pages:
        description: 'Maximum pages to crawl'
        required: false
        default: '10'
      baseline:
        description: 'Path to baseline file (e.g. results/baseline.json)'
        required: false
        default: ''

jobs:
  test_suite:
    name: Playwright & Quality Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest
          sudo apt-get update && sudo apt-get install -y xvfb
          playwright install --with-deps chromium

      - name: Run Playwright Test Suite (Headless Mode)
        env:
          PLAYWRIGHT_HEADLESS: 'true'
        run: |
          pytest tests/test_auth_crawl.py tests/test_responsive_engine.py tests/test_ci_quality_gate.py -v

      - name: Run Playwright Test Suite (Headed Mode via Xvfb)
        env:
          PLAYWRIGHT_HEADLESS: 'false'
        run: |
          xvfb-run --auto-servernum pytest tests/test_auth_crawl.py tests/test_responsive_engine.py -v

      - name: Upload Test Run Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-run-artifacts
          path: results/test-runs/

  qa_scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps

      - name: Run AI QA Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI_FAIL_ON_NEW_CRITICAL: 'true'
          CI_FAIL_ON_NEW_HIGH: 'true'
          CI_FAIL_ON_NEW_MEDIUM: 'false'
        run: |
          # Build baseline argument
          BASELINE_ARG=""
          if [ -n "${{ github.event.inputs.baseline }}" ]; then
            BASELINE_ARG="--baseline ${{ github.event.inputs.baseline }}"
          fi

          python run_qa.py ${{ github.event.inputs.target_url }} \
            --max-pages ${{ github.event.inputs.max_pages }} \
            --ci \
            $BASELINE_ARG

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: qa-results
          path: |
            results/
            screenshots/
