services:
  # 1. FastAPI Backend (Docker environment for complete Chromium & OS dependencies)
  - type: web
    name: ai-qa-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-qa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-qa-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 2. Celery Background Worker (Docker environment for Playwright browser crawling)
  - type: worker
    name: ai-qa-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A worker.celery_app worker --loglevel=info -Q qa_queue -c 2
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-qa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-qa-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 3. Next.js Web UI Frontend
  - type: web
    name: ai-qa-web
    env: node
    plan: starter
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  # 4. Redis Queue Broker
  - type: redis
    name: ai-qa-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # 5. PostgreSQL Database
  - name: ai-qa-postgres
    plan: starter
    databaseName: ai_qa_db
    user: postgres
