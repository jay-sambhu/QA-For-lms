services:
  # 1. FastAPI Backend (Docker environment for complete Chromium & OS dependencies)
  - type: web
    name: ai-qa-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-qa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-qa-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://jasuss.tech,https://www.jasuss.tech,https://api.jasuss.tech"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 2. Celery Background Worker (Docker environment for Playwright browser crawling)
  - type: worker
    name: ai-qa-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A worker.celery_app worker --loglevel=info -Q qa_queue,priority_queue,celery -c 2
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-qa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-qa-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 3. Uptime Watchdog (keep-alive pinger — prevents free-tier spin-downs)
  - type: worker
    name: ai-qa-watchdog
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.watchdog
    plan: starter
    envVars:
      - key: API_BASE_URL
        value: "https://ai-qa-api.onrender.com"
      - key: PING_INTERVAL
        value: "900"
      - key: REQUEST_TIMEOUT
        value: "30"
      - key: MAX_RETRIES
        value: "3"
      - key: WATCHDOG_LOG_LEVEL
        value: "INFO"

  # 4. Next.js Web UI Frontend
  - type: web
    name: ai-qa-web
    env: node
    plan: starter
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: ai-qa-api
          property: hostport
      - key: NEXT_PUBLIC_APP_URL
        value: "https://jasuss.tech"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

  # 5. Redis Queue Broker
  - type: redis
    name: ai-qa-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # 6. PostgreSQL Database
  - name: ai-qa-postgres
    plan: starter
    databaseName: ai_qa_db
    user: ai_qa_user
